<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeCast AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>VibeCast AI</h1>
        <p>Your mood-based podcast recommendations.</p>
        <textarea id="podcastText" rows="5" readonly>
            Here's a podcast recommendation for your current vibe:
            "The Daily" - For when you need to stay informed and feel connected.
            "Stuff You Should Know" - For when you're curious and want to learn something new.
        </textarea>
        <button id="copyButton">Copy Recommendation</button>
        <button id="themeToggleButton">Toggle Dark/Light Mode</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
